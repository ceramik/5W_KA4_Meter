name: Build KA4 NEMESIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test fare model
        run: |
          mkdir -p /tmp/fare-test
          javac -encoding UTF-8 -d /tmp/fare-test app/src/main/java/com/veloster/vehicle/TaxiFare.java app/src/main/java/com/veloster/vehicle/TaxiTariff.java tests/FareModelTest.java
          java -cp /tmp/fare-test com.veloster.vehicle.FareModelTest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Configure stable signing
        env:
          KEY_B64: ${{ secrets.METER_KEYSTORE_B64 }}
          METER_STORE_PASSWORD: ${{ secrets.METER_STORE_PASSWORD }}
          METER_KEY_ALIAS: ${{ secrets.METER_KEY_ALIAS }}
          METER_KEY_PASSWORD: ${{ secrets.METER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ]; then
            umask 077
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/meter.jks"
            echo "METER_KEYSTORE=$RUNNER_TEMP/meter.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          METER_STORE_PASSWORD: ${{ secrets.METER_STORE_PASSWORD }}
          METER_KEY_ALIAS: ${{ secrets.METER_KEY_ALIAS }}
          METER_KEY_PASSWORD: ${{ secrets.METER_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KA4_NEMESIS_TaxiMeter.apk

      - name: Build NEMESIS USB package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(awk '/^[[:space:]]*versionCode / {print $2; exit}' app/build.gradle)
          VERSION=$(awk '/^[[:space:]]*versionName / {gsub(/\047/,"",$2); print $2; exit}' app/build.gradle)
          mkdir -p "$RUNNER_TEMP/published"
          APK=dist/KA4_NEMESIS_TaxiMeter.apk
          if gh release view "v$CODE" >/dev/null 2>&1; then
            gh release download "v$CODE" --pattern KA4_NEMESIS_TaxiMeter.apk --dir "$RUNNER_TEMP/published"
            APK="$RUNNER_TEMP/published/KA4_NEMESIS_TaxiMeter.apk"
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --min-sdk-version 19 "$APK"
          python3 tools/build_nemesis.py "$APK" "$VERSION" dist/5W_TaxiMeter_NEMESIS_USB.zip

      - name: Upload NEMESIS USB package
        uses: actions/upload-artifact@v4
        with:
          name: 5W-TaxiMeter-NEMESIS-USB
          path: dist/5W_TaxiMeter_NEMESIS_USB.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KA4-NEMESIS-TaxiMeter-USB
          path: dist/KA4_NEMESIS_TaxiMeter.apk
          if-no-files-found: error

      - name: Publish signed OTA release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_B64: ${{ secrets.METER_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "Stable signing secret missing; OTA publication skipped."
            exit 0
          fi
          CODE=$(awk '/^[[:space:]]*versionCode / {print $2; exit}' app/build.gradle)
          TAG="v$CODE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/5W_TaxiMeter_NEMESIS_USB.zip --clobber
            echo "Existing release APK unchanged; USB package added."
            exit 0
          fi
          gh release create "$TAG" dist/KA4_NEMESIS_TaxiMeter.apk dist/5W_TaxiMeter_NEMESIS_USB.zip --target "$GITHUB_SHA" --title "5W TaxiMeter $TAG" --generate-notes --latest
