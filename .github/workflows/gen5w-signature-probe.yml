name: Gen5W signature diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gen5w-signature-probe.yml'
      - 'tools/build_signature_probe.py'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build minimal install probes
        env:
          KEY_B64: ${{ secrets.METER_KEYSTORE_B64 }}
          METER_STORE_PASSWORD: ${{ secrets.METER_STORE_PASSWORD }}
          METER_KEY_ALIAS: ${{ secrets.METER_KEY_ALIAS }}
          METER_KEY_PASSWORD: ${{ secrets.METER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_B64"
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/meter.jks"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist "$RUNNER_TEMP/probe"
          keytool -genkeypair -keystore "$RUNNER_TEMP/probe.jks" -storepass probe-test-only -keypass probe-test-only -alias probe -keyalg RSA -keysize 3072 -sigalg SHA384withRSA -validity 3650 -dname "CN=Gen5W Diagnostic"
          for KIND in samekey testkey; do
            printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="me.bamtol.gen5wprobe.%s" android:versionCode="1" android:versionName="1.0"><uses-sdk android:minSdkVersion="19" android:targetSdkVersion="19"/><application android:label="Gen5W Signature Probe" android:hasCode="false"/></manifest>' "$KIND" > "$RUNNER_TEMP/probe/AndroidManifest.xml"
            "$BT/aapt" package -f -M "$RUNNER_TEMP/probe/AndroidManifest.xml" -I "$ANDROID_HOME/platforms/android-34/android.jar" -F "$RUNNER_TEMP/probe/$KIND-unsigned.apk"
            "$BT/zipalign" -f 4 "$RUNNER_TEMP/probe/$KIND-unsigned.apk" "$RUNNER_TEMP/probe/$KIND-aligned.apk"
            if [ "$KIND" = samekey ]; then
              KS="$RUNNER_TEMP/meter.jks"; ALIAS="$METER_KEY_ALIAS"; SP=env:METER_STORE_PASSWORD; KP=env:METER_KEY_PASSWORD
            else
              KS="$RUNNER_TEMP/probe.jks"; ALIAS=probe; SP=pass:probe-test-only; KP=pass:probe-test-only
            fi
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "$SP" --key-pass "$KP" --min-sdk-version 19 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "dist/$KIND.apk" "$RUNNER_TEMP/probe/$KIND-aligned.apk"
            "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 19 --max-sdk-version 19 "dist/$KIND.apk"
          done
          python3 tools/build_signature_probe.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: Gen5W-Signature-Probe
          path: dist/Gen5W_Signature_Probe_USB.zip
      - name: Publish diagnostic asset without changing OTA
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v21 dist/Gen5W_Signature_Probe_USB.zip --clobber
