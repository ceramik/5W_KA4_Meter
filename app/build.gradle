plugins { id 'com.android.application' }
android {
    namespace 'com.veloster.vehicle'
    compileSdk 34
    defaultConfig {
        applicationId 'me.bamtol.ka4taximeter'
        minSdk 19
        targetSdk 24
        versionCode 21
        versionName '0.5.14'
    }
    signingConfigs {
        if (System.getenv("METER_KEYSTORE")) {
            stable {
                storeFile file(System.getenv("METER_KEYSTORE"))
                storePassword System.getenv("METER_STORE_PASSWORD")
                keyAlias System.getenv("METER_KEY_ALIAS")
                keyPassword System.getenv("METER_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv("METER_KEYSTORE")) signingConfig signingConfigs.stable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies { implementation 'com.google.zxing:core:3.3.3' }
